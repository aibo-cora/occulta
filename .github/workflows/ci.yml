name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop
      - 'release/**'

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26

    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 17" || true
          xcrun simctl bootstatus "iPhone 17" -b

      # xcpretty (last released 2018) only matches XCTest's Objective-C selector
      # format, so it parsed this suite — 42 of 44 test files are Swift Testing —
      # as zero tests and reported zero failures. xcbeautify has dedicated
      # SwiftTesting capture groups that feed its JUnit report.
      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          # pipefail so a test failure fails the step: without it the step takes
          # xcbeautify's status and a red suite reports green. It makes xcbeautify's
          # own status fail the step too, which is intended — if the formatter cannot
          # run, the JUnit report below is missing and the results are unreadable.
          set -o pipefail
          xcodebuild test \
            -project Occulta.xcodeproj \
            -scheme OccultaTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -skip-testing:OccultaTests/KeychainMigrationSETests \
            2>&1 | tee xcodebuild.log \
            | xcbeautify --report junit --report-path . --junit-report-filename test-results.xml

      # OccultaCore's own tests use it as another app would, so they can't run inside the app's
      # test bundle, which links both modules. The package scheme runs them.
      - name: Run OccultaCore API tests
        if: always()
        timeout-minutes: 10
        working-directory: OccultaCore
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OccultaCore-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            2>&1 | xcbeautify

      # That scheme builds every package target into one directory, so a test target there can
      # import OccultaFormats without declaring it and Xcode won't object. SwiftPM's import check
      # does object, which is what keeps the app-only formats out of the public API's reach.
      - name: Check OccultaCore imports only what it declares
        if: always()
        timeout-minutes: 10
        working-directory: OccultaCore
        run: |
          swift build --build-tests \
            --explicit-target-dependency-import-check error \
            --triple arm64-apple-ios18.6-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            xcodebuild.log
            TestResults.xcresult

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: OccultaTests
          path: test-results.xml
          reporter: java-junit
